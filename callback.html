<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-3DuMiEtVoD1helnoSUG5JJpgmI5Qnd0nR3BjBn6jfPQ='; base-uri 'none'; form-action 'none'" />
    <title>Returning to Health Hub</title>
    <style>
      :root { --bg: #fff; --text: #16181d; --muted: #5b616e; --accent: #2457d6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0c0f; --text: #eceef2; --muted: #9aa1ae; --accent: #7aa2ff; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 28rem; padding: 24px; text-align: center; }
      p { color: var(--muted); }
      a { display: inline-block; margin-top: 8px; padding: 10px 18px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Returning to Health Hub…</h1>
      <p id="note">WHOOP sent you here. This page hands your approval back to Health Hub on your own computer.</p>
      <a id="go" href="#" hidden>Continue to Health Hub</a>
      <noscript><p>Turn on JavaScript to finish connecting WHOOP.</p></noscript>
    </main>
    <script>
      // The WHOOP Redirect URL for a Health Hub that runs only on its owner's computer. WHOOP requires an https
      // Redirect URL; the Hub answers on http://localhost. This static page bridges the two inside the browser:
      // it forwards only WHOOP's one-time `code`, the Hub's `state`, or WHOOP's `error`, each checked, to the fixed
      // local address below, and nowhere else (so it cannot be used to send anyone to another site). It stores and
      // sends nothing anywhere: the code is useless without the client secret, which only the Hub holds, and the
      // Hub accepts it only with a state it issued to the same signed-in session.
      (function () {
        var HUB = "http://localhost:4500/api/health/whoop/callback";
        var given = new URLSearchParams(window.location.search);
        var out = new URLSearchParams();
        var rules = { code: /^[A-Za-z0-9._~-]{1,2048}$/, state: /^[A-Za-z0-9._~-]{8,128}$/, error: /^[a-z_]{1,64}$/ };
        Object.keys(rules).forEach(function (k) {
          var v = given.get(k);
          if (v && rules[k].test(v)) out.set(k, v);
        });
        // The code leaves the address bar and the history entry straight away.
        window.history.replaceState(null, "", window.location.pathname);
        var note = document.getElementById("note");
        if (!out.has("state") || !(out.has("code") || out.has("error"))) {
          note.textContent = "Nothing to hand back. Start again from Health Hub: Health, Settings, WHOOP, Connect WHOOP.";
          return;
        }
        var target = HUB + "?" + out.toString();
        var go = document.getElementById("go");
        go.href = target;
        go.hidden = false;
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
